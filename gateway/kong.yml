_format_version: "3.0"
_transform: true

services:
  - name: bff
    url: http://bff:4000
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: bff-public
        paths:
          - /api
        strip_path: true
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
                - X-Usuario-Id
              exposed_headers:
                - X-Gateway
                - X-RateLimit-Limit-Minute
                - X-RateLimit-Remaining-Minute
              credentials: false
              max_age: 3600
              preflight_continue: false
          - name: rate-limiting
            config:
              minute: 120
              hour: 3000
              policy: local
              fault_tolerant: true
              hide_client_headers: false
              limit_by: ip
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Gateway:kong"
